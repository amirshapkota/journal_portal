<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Guest Editor Assignment</title>
  </head>
  <body>
    <p>Dear {{ guest_editor_name }},</p>
    <p>
      You have been assigned as Guest Editor for
      <strong>{{ submission_title }}</strong> (ID: {{ submission_id }}) in {{
      journal_name }}.
    </p>
    <p>Assigned by: {{ assigned_by }}</p>
    <p>Notes: {{ assignment_notes }}</p>
    <p>
      Open assignment: <a href="{{ assignment_url }}">{{ assignment_url }}</a>
    </p>
  </body>
</html>
